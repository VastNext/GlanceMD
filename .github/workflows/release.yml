name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例如 v1.4.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: 整理 Windows 产物
        shell: bash
        run: cp target/x86_64-pc-windows-msvc/release/GlanceMD.exe GlanceMD-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: GlanceMD-windows-x64.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo install cargo-packager --locked
      - run: cargo build --release --target ${{ matrix.target }}
      - name: 打包 macOS 应用
        run: cargo packager --release --target ${{ matrix.target }} --formats app,dmg --out-dir dist
      - name: 标记未签名预览包
        run: |
          for file in dist/*; do
            case "$file" in
              *.dmg) mv "$file" "GlanceMD-macos-${{ matrix.arch }}-unsigned.dmg" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: GlanceMD-macos-${{ matrix.arch }}-unsigned.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked
      - run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: 打包 Linux 应用
        run: cargo packager --release --target x86_64-unknown-linux-gnu --formats deb,appimage --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: 确定版本标签
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "GlanceMD $TAG" \
              --notes "Windows、macOS 和 Linux 构建产物。macOS 包当前未签名，首次运行可能需要在系统设置中手动允许。"
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
