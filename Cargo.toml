[package]
name = "glancemd"
version = "1.3.6"
edition = "2021"

# 产物名与仓库名保持一致：GlanceMD.exe
[[bin]]
name = "GlanceMD"
path = "src/main.rs"

[dependencies]
wry = "0.49"
tao = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
percent-encoding = "2"
png = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.35"
windows = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
